services:
  # 静态站点：宿主机端口可通过环境变量 HOST_PORT 配置，默认 8080
  web:
    build:
      context: .
      target: runtime
    image: freq-planner-web:latest
    ports:
      - "${HOST_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s

  # 一次性校验服务：代码测试 → 构建检查 → 站点 HTTP 冒烟，随后自行退出，
  # 退出码即校验结果（0 全部通过，非 0 存在失败）。
  verify:
    build:
      context: .
      target: test
    image: freq-planner-verify:latest
    depends_on:
      web:
        condition: service_healthy
    environment:
      SMOKE_BASE_URL: http://web
    command:
      - sh
      - -c
      - |
        set -eu
        echo "== [1/3] 单元测试 =="
        npm test
        echo "== [2/3] 构建检查（tsc 类型检查 + vite 构建） =="
        npm run build
        echo "== [3/3] 站点 HTTP 冒烟 =="
        sh scripts/smoke.sh
        echo "== verify 全部通过，退出码 0 =="
    restart: "no"
