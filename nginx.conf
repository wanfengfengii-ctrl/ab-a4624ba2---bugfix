server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 容器/编排健康检查端点
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    # 静态资源长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
